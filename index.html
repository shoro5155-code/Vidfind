<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VidFind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
  /* Layout: centered home that slides into a top bar + results grid after the first search */
  :root {
    --bg: #f6f7fb; --surface: #ffffff; --fg: #161a2b; --muted: #5d6480;
    --line: #dde1ee; --accent: #3b4fd8; --accent-ink: #ffffff;
    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1220; --surface: #181c2e; --fg: #e9ebf5; --muted: #9aa1bd; --line: #2a3050; --accent: #8a9bff; --accent-ink: #0f1220; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 var(--body); }
  a { color: inherit; }
  button, input { font: inherit; }

  header { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
           min-height: 70vh; padding: 24px 16px; transition: min-height .35s ease; }
  body.searched header { flex-direction: row; min-height: 0; gap: 20px; padding: 14px 16px;
           border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: 0; z-index: 5; }
  .logo { font: 800 clamp(48px, 9vw, 84px)/1 var(--display); letter-spacing: -0.04em; margin: 0; cursor: pointer; }
  .logo span { color: var(--accent); }
  body.searched .logo { font-size: 28px; }

  form { display: flex; width: min(640px, 100%); background: var(--surface); border: 1px solid var(--line);
         border-radius: 999px; padding: 6px; gap: 6px; }
  form:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
  #q { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--fg); padding: 10px 16px; outline: none; }
  .go { border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 600; padding: 10px 22px; cursor: pointer; }
  .go:focus-visible, .card:focus-visible, .more:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .hint { color: var(--muted); font-size: 14px; margin: -12px 0 0; }
  body.searched .hint { display: none; }

  main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; }
  .status { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px 20px; }
  .card { display: flex; flex-direction: column; gap: 10px; text-align: left; text-decoration: none; background: none; border: 0; padding: 0; color: inherit; cursor: pointer; border-radius: 12px; }
  .card:hover h3 { color: var(--accent); }
  .card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 12px; background: var(--line); }
  .card h3 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { color: var(--muted); font-size: 14px; }
  .play-label { color: var(--accent); font-size: 13px; font-weight: 600; }
  .more { display: block; margin: 36px auto 0; padding: 10px 26px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; font-weight: 600; }
  .notice { padding: 12px 16px; border: 1px solid var(--line); border-radius: 12px; font-size: 14px; }
  .topics { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .topics a { text-decoration: none; color: var(--muted); padding: 6px 16px; border: 1px solid var(--line); border-radius: 999px; font-size: 14px; }
  .topics a:hover { color: var(--accent); border-color: var(--accent); }
  body.searched .topics { display: none; }
  .catalog-note { max-width: 740px; margin: 0 auto; padding: 12px 24px 36px; text-align: center; color: var(--muted); font-size: 13px; }
  .source-tabs { display: flex; justify-content: center; gap: 8px; }
  .source-tabs a { text-decoration: none; padding: 8px 18px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 14px; }
  .source-tabs a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  body.searched header { flex-wrap: wrap; gap: 12px 20px; }
  body.searched .source-tabs { flex-basis: 100%; }
  .attribution { display: block; margin: 0 auto 12px; width: max-content; }
  .attribution img { width: 120px; height: auto; background: #fff; padding: 8px; border-radius: 4px; }

  @media (max-width: 600px) { body.searched header { flex-direction: column; gap: 10px; } }
  @media (prefers-reduced-motion: reduce) { header { transition: none; } }
</style>
</head>
<body class="__VDF_BODY_CLASS__" data-server-rendered="__VDF_RENDERED__" data-next-token="__VDF_NEXT_TOKEN__" data-source="__VDF_SOURCE__">
<header>
  <h1 class="logo" id="logo" title="Back to start">Vid<span>Find</span></h1>
  <form id="search" role="search">
    <input name="source" type="hidden" value="__VDF_SOURCE__">
    <input id="q" name="q" type="search" value="__VDF_QUERY__" placeholder="Search for videos" autocomplete="off" aria-label="Search for videos">
    <button class="go" type="submit">Search</button>
  </form>
  <p class="hint">Find videos. Watch them here.</p>
  <nav class="source-tabs" aria-label="Video sources">
    <a id="youtube-source" href="__VDF_YOUTUBE_LINK__" __VDF_YOUTUBE_CURRENT__>YouTube</a>
    <a id="direct-source" href="__VDF_DIRECT_LINK__" __VDF_DIRECT_CURRENT__>Direct videos</a>
  </nav>
  <nav class="topics" aria-label="Try a topic">
    <a href="/?q=history">History</a><a href="/?q=science">Science</a><a href="/?q=computers">Technology</a><a href="/?q=travel">Travel</a>
  </nav>
</header>

<main id="main" __VDF_MAIN_HIDDEN__>
  <p class="status" id="status" aria-live="polite">__VDF_STATUS__</p>
  <p class="notice" id="notice" __VDF_NOTICE_HIDDEN__>__VDF_NOTICE__</p>
  <div class="grid" id="grid">__VDF_RESULTS__</div>
  <button class="more" id="more" __VDF_MORE_HIDDEN__>Show more</button>
</main>

<footer class="catalog-note">
  <a class="attribution" href="__VDF_YOUTUBE_LINK__" __VDF_YOUTUBE_HIDDEN__><img src="/youtube-logo.svg" alt="YouTube"></a>
  <p>__VDF_CATALOG_NOTE__</p>
  <a href="/privacy">Privacy</a> · <a href="https://www.youtube.com/t/terms">YouTube Terms</a> · <a href="https://policies.google.com/privacy">Google Privacy Policy</a>
</footer>

<script>
  const $ = (id) => document.getElementById(id);
  let currentQuery = new URLSearchParams(location.search).get("q") || "";
  const currentSource = document.body.dataset.source || "youtube";
  let nextToken = document.body.dataset.nextToken || null;
  let searchRequest = 0;

  function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
  function decode(s) { const t = document.createElement("textarea"); t.innerHTML = s; return t.value; }

  function openDocumentSearch(q, pageToken) {
    const url = new URL("/", location.href);
    url.searchParams.set("q", q);
    url.searchParams.set("source", currentSource);
    if (pageToken) url.searchParams.set("pageToken", pageToken);
    $("status").textContent = "Opening search results…";
    location.assign(url.href);
  }

  async function runSearch(q, append) {
    const request = ++searchRequest;
    const pageToken = append ? nextToken : null;
    $("status").textContent = append ? "Loading more…" : `Searching for “${q}”…`;
    $("more").hidden = true;
    $("notice").hidden = true;
    if (!append) $("grid").innerHTML = "";
    try {
      const params = new URLSearchParams({ q, source: currentSource });
      if (pageToken) params.set("pageToken", pageToken);
      const endpoint = new URL("/api/search", location.href);
      endpoint.search = params.toString();
      const r = await fetch(endpoint.href, {
        headers: { Accept: "application/json" },
        cache: "no-store",
      });
      let data;
      try { data = JSON.parse(await r.text()); }
      catch (_) { if (request === searchRequest) return openDocumentSearch(q, pageToken); return; }
      if (request !== searchRequest) return;
      if (!r.ok) throw new Error(data?.error || "Search failed.");
      if (!data || !Array.isArray(data.results)) return openDocumentSearch(q, pageToken);
      nextToken = data.nextPageToken;
      for (const v of data.results) addCard(v);
      const count = $("grid").children.length;
      $("status").textContent = count ? `${count} videos for “${q}”` : `No videos found for “${q}”. Try another topic.`;
      $("more").hidden = !nextToken;
      $("notice").textContent = data.notice || "";
      $("notice").hidden = !data.notice;
    } catch (e) {
      if (request !== searchRequest) return;
      if (e.name === "TypeError" || e.name === "SyntaxError") return openDocumentSearch(q, pageToken);
      $("status").textContent = "Couldn't search right now: " + e.message;
    }
  }

  function addCard(v) {
    const b = document.createElement("a");
    b.className = "card";
    b.href = "/watch?" + new URLSearchParams({ id: v.id, q: currentQuery, source: currentSource });
    const title = decode(v.title), channel = decode(v.channel);
    const published = new Date(v.published);
    const date = Number.isNaN(published.getTime()) ? "" : published.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
    b.innerHTML = `<img src="${esc(v.thumbnail)}" alt="" loading="lazy"><h3>${esc(title)}</h3><div class="meta">${esc(channel)}${date ? " · " + date : ""}</div><span class="play-label">▶ Play video</span>`;
    $("grid").appendChild(b);
  }

  $("search").addEventListener("submit", (e) => {
    e.preventDefault();
    const q = $("q").value.trim();
    if (!q) return;
    currentQuery = q; nextToken = null;
    document.body.classList.add("searched");
    $("main").hidden = false;
    history.replaceState(null, "", "?" + new URLSearchParams({ q, source: currentSource }));
    $("youtube-source").href = "/?" + new URLSearchParams({ q, source: "youtube" });
    $("direct-source").href = "/?" + new URLSearchParams({ q, source: "direct" });
    runSearch(q, false);
  });
  $("more").addEventListener("click", () => runSearch(currentQuery, true));
  $("logo").addEventListener("click", () => { location.href = "/"; });

  // Support links like yoursite.com/?q=cooking
  const start = new URLSearchParams(location.search).get("q");
  if (start && document.body.dataset.serverRendered !== "true") {
    $("q").value = start; $("search").requestSubmit();
  }
</script>
</body>
</html>
